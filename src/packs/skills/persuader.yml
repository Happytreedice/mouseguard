  description: |-
    <p>Персонажи с этим навыком способны убедить собеседника. Они могут дружелюбно объяснить, что в интересах самого собеседника сделать что-то для переговорщика или помочь ему.</p>
    <p>Такой навык не подходит для публичных речей. Его можно использовать только в личной беседе.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>Таблица «Типы конфликта» (с.110): «Спор» — проверяемый навык «Переговорщик», основа диспозиции «Воля».</li>
    <li>Конфликты (с.118–120): «Спор» — любые действия «Переговорщик» (Финт и Манёвр — или «Манипулятор»); в «Переговорах» — Финт и Манёвр.</li>
    </ul>
    <p><em>Книга правил, с. 276.</em></p>
  supplies: ''
  factors: |-
    <p>Навык «Переговорщик» используется при встречных проверках против навыков «Переговорщик» и «Манипулятор», а также способности «Воля» противника. В некоторых типах конфликтов этот навык можно использовать при проведении обычной проверки.</p>
    <p>Чтобы убедить кого-то, что в его интересах действовать именно так, как предлагает ваш персонаж, проведите встречную проверку навыка «Переговорщик» против способности «Воля» убеждаемого. Другими словами, такая проверка проводится, если вы хотите убедить кого-то сделать что-то для вас, а он не соглашается.</p>
    <p>Если же ваш персонаж хочет убедить кого-то в своей правоте, а тот, кого он убеждает, спорит с ним, проведите встречную проверку навыка «Переговорщик» против навыка «Переговорщик» убеждаемого. Другими словами, такая проверка проводится, если вы спорите с кем-то о том, кто из вас прав, а кто — нет.</p>
