  description: |-
    <p>Обладающие таким навыком персонажи следят за самочувствием и здоровьем других мышей.</p>
    <p>При помощи навыка «Лекарь» можно изготовить компрессы и снадобья, чтобы помочь персонажам избавиться от состояний «Усталый» и «Разозлённый». Эти препараты будут считаться припасами при проведении проверки способности «Воля» или «Здоровье» для восстановления от указанных состояний.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>Глава «Состояния и восстановление» (с.144–145): чтобы залечить рану, лекарь проходит проверку «Лекарь» против ПР 3; чтобы излечить больного — против ПР 4. При провале состояние всё равно снимается, но ведущий навсегда снижает на 1 один навык или одну способность (кроме «Ресурсы» и «Связи»).</li>
    <li>С.102: проверка навыка «Лекарь» — исключение из правила «ведущий сам решает, справился ли его персонаж» (её всегда бросают).</li>
    <li>С.266: весной и осенью «Сборщик» может добыть лечебные травы или коренья для лекаря (+1К при оказании медицинской помощи).</li>
    </ul>
    <p><em>Книга правил, с. 271–272.</em></p>
  supplies: <p>Персонажу с навыком «Лекарь» может помочь припасами (травами) другой персонаж с навыком «Сборщик» и (лекарствами) «Учёный».</p>
  factors: |-
    <ul>
    <li><strong>Лечение при:</strong> ранении (ПР 3); болезни (ПР 4).</li>
    <li><strong>Препараты при состояниях:</strong> «Усталый»; «Больной»; «Раненый»; «Голодный»; «Разозлённый».</li>
    </ul>
