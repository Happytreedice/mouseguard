  description: |-
    <p>С помощью жерновов персонажи с таким навыком превращают твёрдые субстанции в порошки и муку, чтобы затем их можно было использовать для приготовления пищи, в пивоварении и промышленном производстве.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>«Мельник» сам даёт припасы: бумагу — «Архивариусу» и «Картографу», солод — «Пивовару», а также «Пекарю» и «Повару».</li>
    <li>С.204 (засуха и голод): сложность обычных проверок «Сборщик» +3, что также увеличивает на 3 сложность проверок «Пекарь» и «Мельник».</li>
    </ul>
    <p><em>Книга правил, с. 272.</em></p>
  supplies: ''
  factors: |-
    <ul>
    <li><strong>Тип действия:</strong> помол зерна; изготовление порошка для строительных растворов; изготовление бумаги.</li>
    <li><strong>Для кого:</strong> патруль; хозяйство; бизнес или большая постройка; городок; большой город.</li>
    </ul>
