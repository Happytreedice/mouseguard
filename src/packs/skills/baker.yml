  description: |-
    <p>Персонажи с этим навыком могут выпекать ароматный хлеб, вкусные печенья и сладкие пирожные.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>С.142: состояние «Голодный/Испытывающий жажду» снимается обычной проверкой «Сборщик», «Повар», «Пивовар», «Пекарь» или способности «Ресурсы» (обычно ПР 1).</li>
    <li>«Пекарь» сам помогает навыкам «Гончар» и «Повар».</li>
    </ul>
    <p><em>Книга правил, с. 276.</em></p>
  supplies: <p>Персонажу с навыком «Пекарь» могут помочь припасами другие персонажи с навыками «Пивовар», «Мельник» и «Пчеловод».</p>
  factors: |-
    <ul>
    <li><strong>Продукты:</strong> мука; семена и зерно; дикорастущие растения.</li>
    <li><strong>Для кого:</strong> одна мышь; две мыши; патруль; домохозяйство; пекарня.</li>
    </ul>
