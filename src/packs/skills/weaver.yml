  description: |-
    <p>Персонажи с таким навыком могут изготавливать ткани и шить из них плащи, фартуки, одеяла, простыни и гобелены.</p>
    <p>Сделанные с помощью этого навыка вещи можно использовать как припасы при проверках для восстановления от состояния «Усталый», полученного из-за того, что персонаж замёрз и/или промок.</p>
    <p><strong>Помощь:</strong> При проверке этого навыка можно помочь подходящим знанием.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>«Ткач» сам даёт припасы «Оружейнику».</li>
    </ul>
    <p><em>Книга правил, с. 281–282.</em></p>
  supplies: <p>Персонажа с навыком «Ткач» может снабдить припасами (мехом и шкурами) другой персонаж с навыком «Охотник», (растительными волокнами для ткани и ниток) «Сборщик», (шёлковой пряжей) «Насекомовод», а также (красками) «Каменщик», «Учёный» или «Насекомовод».</p>
  factors: |-
    <ul>
    <li><strong>Тип:</strong> одеяло; постельное бельё; плащ; одежда; гобелен.</li>
    </ul>
