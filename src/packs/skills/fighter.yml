details:
  навык: Боец
  описание: По своей природе мыши не приспособлены для драк и сражений. С помощью тренировок они преодолевают своё природное
    стремление избегать боя и со временем могут научиться ловить, выводить из строя и даже убивать своих врагов, используя
    для этого лапы, зубы, оружие и любое другое подходящее снаряжение.
  припасы: Специальные припасы в описании навыка не указаны; в бою используется боевое снаряжение и оружие (мечи, топоры,
    копья, луки, пращи, щиты).
  факторы_навыка: Навык «Боец» используется при встречных проверках против способности «Природа» или навыка «Боец» противника.
    В некоторых типах конфликтов (например, действия Атака и Финт во время Схватки) этот навык можно использовать при проведении
    обычной проверки.
  помощь:
    навыки:
    - Охотник
