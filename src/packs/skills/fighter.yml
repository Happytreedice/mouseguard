name: Боец
type: skill
img: icons/svg/item-bag.svg
system:
  description: |
    <p>По своей природе мыши не приспособлены для драк и сражений. С помощью тренировок они преодолевают своё природное стремление избегать боя и со временем могут научиться ловить, выводить из строя и даже убивать своих врагов, используя для этого лапы, зубы, оружие и любое другое подходящее снаряжение.</p>
    <p><strong>Припасы:</strong> Специальные припасы в описании навыка не указаны; в бою используется боевое снаряжение и оружие (мечи, топоры, копья, луки, пращи, щиты).</p>
    <p><strong>Факторы навыка:</strong> Навык «Боец» используется при встречных проверках против способности «Природа» или навыка «Боец» противника. В некоторых типах конфликтов (например, действия Атака и Финт во время Схватки) этот навык можно использовать при проведении обычной проверки.</p>
    <p><strong>Помощь:</strong> Охотник.</p>
