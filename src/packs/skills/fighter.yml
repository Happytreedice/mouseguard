  description: |-
    <p>По своей природе мыши не приспособлены для драк и сражений. С помощью тренировок они преодолевают своё природное стремление избегать боя и со временем могут научиться ловить, выводить из строя и даже убивать своих врагов, используя для этого лапы, зубы, оружие и любое другое подходящее снаряжение.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>Таблица «Типы конфликта» (с.110): «Схватка» — проверяемый навык «Боец», основа диспозиции «Здоровье» или «Природа»; «Схватка со зверем» — «Боец» или «Охотник», основа «Здоровье» или «Природа».</li>
    <li>Конфликты (с.119–120): «Схватка» — Атака и Финт «Боец», Защита и Манёвр «Природа»; «Схватка со зверем» — Атака и Финт «Боец» или «Охотник».</li>
    </ul>
    <p><em>Книга правил, с. 267–268.</em></p>
  supplies: ''
  factors: <p>Навык «Боец» используется при встречных проверках против способности «Природа» или навыка «Боец» противника. В некоторых типах конфликтов этот навык можно использовать при проведении обычной проверки.</p>
