  description: |-
    <p>Персонажи с таким навыком изготавливают изделия из металла: иглы, режущие инструменты, кухонную утварь и инструменты для производства, а также скобяные изделия (дверные петли, подшипники и гвозди).</p>
    <p>Нельзя использовать навык «Кузнец», чтобы делать оружие или броню, для этого существует навык «Оружейник».</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>«Кузнец» сам даёт припасы навыкам «Каменщик» и «Разнорабочий» (инструменты), «Плотник» (скобяные изделия и инструменты), «Оружейник».</li>
    <li>Пример ведущему (с.102): «Кузнец может без проблем сделать котелки и сковородки» — простые вещи ведущий разрешает без броска.</li>
    </ul>
    <p><em>Книга правил, с. 271.</em></p>
  supplies: ''
  factors: |-
    <ul>
    <li><strong>Тип изделия:</strong> скобяные изделия; кухонная утварь; инструменты; небольшие металлические конструкции вроде ворот; большие металлические конструкции вроде ограды; пол или решётка.</li>
    </ul>
