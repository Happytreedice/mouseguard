  description: |-
    <p>Персонажи с этим навыком занимаются ведением записей и хранением информации об исторических событиях. Они также умеют находить нужную информацию в архивах и библиотеках.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>«Архивариус» даёт припасы навыкам «Администратор» (записи или документы) и «Учёный» (записи из архива).</li>
    </ul>
    <p><em>Книга правил, с. 267.</em></p>
  supplies: <p>Персонажу с навыком «Архивариус» может помочь припасами (бумагой) другой персонаж с навыком «Мельник» и (чернилами) «Насекомовод».</p>
  factors: |-
    <ul>
    <li><strong>Написание:</strong> разборчиво; понятно; просто.</li>
    <li><strong>Поиск чего-то:</strong> конкретного; малоизвестного; потерянного; частично сохранившегося.</li>
    </ul>
