name: Архивариус
type: skill
img: icons/svg/item-bag.svg
system:
  description: |
    <p>Персонажи с этим навыком занимаются ведением записей и хранением информации об исторических событиях, а также умеют находить нужную информацию в архивах и библиотеках.</p>
    <p><strong>Припасы:</strong> Персонажу с навыком «Архивариус» может помочь припасами (бумагой) другой персонаж с навыком «Мельник» и (чернилами) — «Насекомовод».</p>
    <p><strong>Факторы навыка:</strong></p>
    <p><em>Написание:</em> разборчиво, понятно, просто.</p>
    <p><em>Поиск чего-то:</em> конкретного, малоизвестного, потерянного, частично сохранившегося.</p>
    <p><strong>Помощь:</strong> Картограф, Администратор.</p>
