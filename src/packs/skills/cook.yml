  description: |-
    <p>В каждом патруле должна быть мышь с таким навыком. Еда поможет избавиться от голода, когда ваши персонажи находятся в диких местах, вдали от дома или уютного трактира.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>С.142: «Голодный/Испытывающий жажду» снимается обычной проверкой «Сборщик», «Повар», «Пивовар», «Пекарь» или «Ресурсы»; обычно ПР 1, ведущий может повысить (дикая местность, погода, нехватка припасов в регионе).</li>
    </ul>
    <p><em>Книга правил, с. 277–278.</em></p>
  supplies: <p>Персонажу с навыком «Повар» могут помочь припасами другие персонажи с навыками «Сборщик» или «Мельник», а также любая мышь, использовавшая свои природные особенности для Поиска припасов.</p>
  factors: |-
    <p>Чтобы снять с персонажа полученное им состояние «Голодный/Испытывающий жажду», следует провести проверку навыка «Повар» против препятствия, сложность которого будет зависеть от перечисленных ниже факторов, а также от происходящей в игре ситуации.</p>
    <ul>
    <li><strong>Для кого:</strong> одна мышь; две мыши; патруль; большая семья; ресторан; район.</li>
    </ul>
