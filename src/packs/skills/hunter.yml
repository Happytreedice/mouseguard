  description: |-
    <p>Отважные мыши, обладающие таким навыком, отправляются в дикие места, чтобы бороться с разными зверями (травоядными, падальщиками и даже хищниками). Используя этот навык и свою смекалку, они выслеживают, ловят, отгоняют и даже убивают зверей, которые могут навредить мышам.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>«Охотник» сам даёт припасы: шкуры и кожу — «Корабелу», мех и шкуры — «Ткачу»; помогает навыкам «Боец», «Знаток зверей», «Разведчик», «Следопыт», «Специалист по выживанию».</li>
    <li>Таблица «Типы конфликта» (с.110): «Схватка со зверем» — «Боец» или «Охотник», основа «Здоровье» или «Природа».</li>
    <li>Конфликты (с.119–120): «Схватка со зверем» — Атака и Финт «Боец» или «Охотник»; Защита и Манёвр — «Знаток зверей» или «Природа».</li>
    </ul>
    <p><em>Книга правил, с. 275.</em></p>
  supplies: ''
  factors: |-
    <p>Навык «Охотник» используется при встречных проверках против способности «Природа», а также при обычных проверках во время схватки со зверем.</p>
    <p>Навык «Охотник» также применяется, чтобы найти информацию о звере: где он добывает себе пропитание, чем он питается, его «оружие».</p>
    <ul>
    <li><strong>Сведения и повадки:</strong> следы; корм/добыча; «оружие» и гнездо/логово.</li>
    <li><strong>Что за зверь:</strong> добыча; хищник.</li>
    <li><strong>Уровень зверя в «Природном порядке» соответствует:</strong> насекомому; мелкой рыбе; летучей мыши; ласке; бобру; лисе; койоту; волку; медведю.</li>
    </ul>
