  description: |-
    <p>Персонажи с этим навыком — известные и уважаемые мыши, ведь они варят пиво для жителей мышиных городов. Если в поселении проблемы с чистой питьевой водой, его обитатели пьют только пиво.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>С.142: «Пивовар» — один из навыков, которым снимают «Голодный/Испытывающий жажду» (обычно ПР 1).</li>
    <li>«Пивовар» сам даёт припасы «Пекарю».</li>
    </ul>
    <p><em>Книга правил, с. 276–277.</em></p>
  supplies: <p>Персонажу с навыком «Пивовар» может помочь припасами (солодом) другой персонаж с навыком «Мельник» и (мёдом) «Пчеловод».</p>
  factors: |-
    <ul>
    <li><strong>Качество пива:</strong> обычное; хорошее; отменное.</li>
    <li><strong>Для кого:</strong> несколько мышей; таверна или ресторан; городок.</li>
    </ul>
