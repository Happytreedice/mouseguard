  description: |-
    <p>Настоящий командир понимает тонкости организации, снабжения и управления армиями мышей в бою.</p>
    <p>Мыши с таким навыком встречаются крайне редко. Мышам не свойственно создание больших армий, участие в кровопролитных сражениях, марширование строем и т. п.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>Таблица «Типы конфликта» (с.110): «Война» — проверяемый навык «Военный», основа диспозиции «Воля».</li>
    <li>Конфликты (с.118–119): «Война» — при любых действиях проверяется «Военный»; при Защите можно также проверять «Оратор» или «Администратор», при Манёвре — «Администратор».</li>
    </ul>
    <p><em>Книга правил, с. 268.</em></p>
  supplies: ''
  factors: |-
    <p>Навык «Военный» в основном используется в конфликтах и при встречных проверках. Его также можно использовать при обычных проверках против препятствий, сложность которых назначается ведущим с учётом следующих факторов:</p>
    <ul>
    <li><strong>Традиции:</strong> население с военными традициями; воинственное население; миролюбивое население.</li>
    <li><strong>Размер:</strong> застава; форт; городок; большой город; замок или цитадель.</li>
    <li><strong>Действие:</strong> уничтожить; защитить или укрепить.</li>
    </ul>
