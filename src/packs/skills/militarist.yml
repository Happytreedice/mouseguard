name: Военный
type: skill
img: icons/svg/item-bag.svg
system:
  description: |
    <p>Настоящий командир понимает тонкости организации, снабжения и управления армиями мышей в бою. Мыши с таким навыком встречаются крайне редко. Мышам не свойственно создание больших армий, участие в кровопролитных сражениях, марширование строем и т. п.</p>
    <p><strong>Припасы:</strong> Специальные припасы в описании навыка не указаны; во время конфликтов типа «Война» используется «оружие войны» (ресурсы, выучка войск, тактическое превосходство над противником).</p>
    <p><strong>Факторы навыка:</strong></p>
    <p>В основном используется в конфликтах и при встречных проверках. При обычных проверках сложность назначается с учётом факторов:</p>
    <p><em>Традиции:</em> население с военными традициями, воинственное население, миролюбивое население.</p>
    <p><em>Размер:</em> застава, форт, городок, большой город, замок или цитадель.</p>
    <p><em>Действие:</em> уничтожить, защитить или укрепить.</p>
    <p><strong>Помощь:</strong> Администратор.</p>
