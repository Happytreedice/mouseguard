  description: |-
    <p>С помощью этого навыка можно предугадывать изменения погодных условий по состоянию почвы и растительности, движению облаков, направлению ветра, влажности воздуха, а также путём наблюдения и сопоставления различных небесных явлений.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>С.60–61: погода во время задания меняется только если игрок использует «Наблюдатель за погодой» или ведущий применяет погодный сюжетный поворот.</li>
    <li>Конфликты (с.118–119): «Путешествие» — Защита и Манёвр «Специалист по выживанию» или «Наблюдатель за погодой».</li>
    </ul>
    <p><em>Книга правил, с. 272–273.</em></p>
  supplies: ''
  factors: |-
    <p>Это очень сильный навык персонажа, при помощи которого игрок может менять погодные условия во время игры. Если он пройдёт проверку данного навыка, он может изменить погоду в игре на продолжительный период времени или даже до конца игровой сессии.</p>
    <p>Чтобы изменить погодные условия в игре, следует провести встречную проверку навыка «Наблюдатель за погодой» против рейтинга времени года (зима 7, весна 6, лето 4, осень 5). За время года бросок делает ведущий.</p>
    <p>При победе игрока считается, что его персонаж предсказал изменение погоды в игре. Поэтому игрок выбирает новые (предсказанные) погодные условия из списка погоды, характерной для текущего игрового сезона. Список вариантов погоды каждого из четырёх сезонов имеется в главе «Времена года». Если игрок выиграл со степенью успеха 2 и более, он может выбрать из списка вариант погоды, в названии которого есть слова «не по сезону».</p>
    <p>Предсказанная погода устанавливается в начале следующей игровой сессии или во время текущей игровой сессии при наступлении сюжетного поворота, связанного с изменением погодных условий. Эта погода будет стоять в игре до следующего сюжетного поворота, связанного с изменением погоды, или до конца игровой сессии. Если погода не была предсказана, ведущий сам решает, какая погода установится в начале игровой сессии или в результате связанного с погодой сюжетного поворота.</p>
    <p>Хотя этот навык довольно силён, у него есть любопытное побочное действие. Например, если персонаж предсказал погоду, в названии которой есть слова «не по сезону», её наступление может принести с собой долгоиграющие последствия (вызвать засуху, паводки, нашествие паразитов или эпидемию). Эти последствия вводит в игру ведущий, основываясь на том, какая погода стояла на протяжении текущего или прошлого сезона.</p>
