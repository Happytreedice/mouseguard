  description: |-
    <p>Мыши с таким навыком являются основой производственных сил любого поселения. Они добывают древесину для плотников, камень для каменщиков и металл для кузнецов, роют канавы, таскают грузы и делают прочую текущую работу.</p>
    <p>Персонаж с навыком «Разнорабочий» может помочь при проверке следующих навыков: «Гончар», «Каменщик», «Кузнец», «Лекарь», «Корабел», «Мельник», «Насекомовод», «Оружейник», «Пекарь», «Пивовар», «Плотник», «Пчеловод», «Сборщик», «Стекольщик», «Ткач» и «Учёный».</p>
    <p><strong>Помощь:</strong> При проверке этого навыка можно помочь любым подходящим навыком.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>«Разнорабочий» даёт припасы (древесиной) «Плотнику».</li>
    </ul>
    <p><em>Книга правил, с. 278–279.</em></p>
  supplies: <p>Этим мышам требуются инструменты (припасы), которые могут изготовить другие мыши, владеющие навыком «Кузнец».</p>
  factors: |-
    <ul>
    <li><strong>Виды работ:</strong> добыча древесины; добыча камня; добыча металла.</li>
    </ul>
