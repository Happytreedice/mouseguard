  description: |-
    <p>Персонажи с этим навыком делают разные предметы из дерева: мебель, двери, лестницы, леса, колёса, черенки и многое другое.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>«Плотник» сам даёт припасы (доски и брёвна) «Корабелу» и помогает ему.</li>
    </ul>
    <p><em>Книга правил, с. 277.</em></p>
  supplies: <p>Персонажу с навыком «Плотник» могут помочь припасами (древесиной) другие персонажи с навыками «Сборщик» и «Разнорабочий», а также (скобяными изделиями и инструментами) «Кузнец».</p>
  factors: |-
    <ul>
    <li><strong>Тип:</strong> домашняя утварь (миски, чашки и тому подобное) или доски, или строительные материалы; деревянные части или лестницы; мебель; небольшие строения (лачуга); комната или широкая и высокая внешняя стена; домик.</li>
    </ul>
