  description: |-
    <p>Мыши с таким навыком умеют вытёсывать камни и использовать их для постройки стен, мостов и зданий.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>«Каменщик» даёт припасы (красками) навыку «Ткач».</li>
    </ul>
    <p><em>Книга правил, с. 270.</em></p>
  supplies: <p>Чтобы облегчить их работу, им требуются хорошие инструменты (припасы), которые изготавливают мыши, владеющие навыком «Кузнец».</p>
  factors: |-
    <ul>
    <li><strong>Сложность:</strong> простая конструкция (например, стена); конструкция средней сложности (например, колонна); сложная конструкция (например, арка); укреплённая конструкция (например, фортификационное сооружение).</li>
    <li><strong>Размер:</strong> маленький (размером со стол); средний (размером со стену комнаты); большой (размером с дом).</li>
    </ul>
