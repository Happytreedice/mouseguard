name: Администратор
type: skill
img: icons/svg/item-bag.svg
system:
  description: |
    <p>Персонажи с этим навыком управляют поселениями или группами мышей. Они пишут законы, занимаются финансами, заполняют отчёты и распределяют ресурсы.</p>
    <p><strong>Припасы:</strong> Персонажу с навыком «Администратор» может помочь припасами (записями или документами) другой персонаж с навыком «Архивариус».</p>
    <p><strong>Факторы навыка:</strong></p>
    <p><em>Тип:</em> отчёт, бюджет, закон, правила снабжения.</p>
    <p><em>Для кого:</em> одна мышь, патруль, застава или форт, бизнес, район, городок, крупный город.</p>
    <p><strong>Помощь:</strong> Архивариус, Оратор.</p>
