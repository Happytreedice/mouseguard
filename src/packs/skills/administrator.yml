  description: |-
    <p>Персонажи с этим навыком управляют поселениями или группами мышей. Они пишут законы, занимаются финансами, заполняют отчёты и распределяют ресурсы.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>«Администратор» сам помогает навыку «Военный» (см. Военный).</li>
    <li>Конфликты (с.118–119): в «Войне» может заменять «Военный» при Защите и Манёвре.</li>
    </ul>
    <p><em>Книга правил, с. 267.</em></p>
  supplies: <p>Персонажу с навыком «Администратор» может помочь припасами (записями или документами) другой персонаж с навыком «Архивариус».</p>
  factors: |-
    <ul>
    <li><strong>Тип:</strong> отчёт; бюджет; закон; правила снабжения.</li>
    <li><strong>Для кого:</strong> одна мышь; патруль; застава или форт; бизнес; район; городок; крупный город.</li>
    </ul>
