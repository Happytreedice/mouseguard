  description: |-
    <p>Персонажи с таким навыком могут использовать ложь, полуправду, жестокие подробности, банальные рассуждения или запугивание, чтобы получить желаемое или достигнуть своей цели.</p>
    <p><strong>Связанные правила:</strong></p>
    <ul>
    <li>Конфликты (с.118–120): в «Переговорах» — Финт и Манёвр; в «Речи» и «Споре» может заменять «Оратор»/«Переговорщик» при Финте и Манёвре (если персонаж пытается соврать, запугать или манипулировать).</li>
    </ul>
    <p><em>Книга правил, с. 272.</em></p>
  supplies: ''
  factors: <p>Этот навык используется при встречных проверках против навыков «Манипулятор» или «Переговорщик», а также способности «Воля» противника. В некоторых типах конфликтов навык «Манипулятор» можно использовать при обычных проверках.</p>
