  description: |-
    <p>Персонажи с этим навыком разбираются во всём, что касается плотов, лодок и кораблей. Они могут делать самые разные плавательные средства: от лодок из листьев до деревянных судов. Их навык также позволяет им управлять любыми кораблями и прокладывать курс.</p>
    <p><em>Книга правил, с. 271.</em></p>
  supplies: <p>Персонажу с навыком «Корабел» может помочь припасами (досками и брёвнами) другой персонаж с навыком «Плотник» и (шкурами и кожей) «Охотник». С помощью таких припасов можно делать более прочные суда.</p>
  factors: |-
