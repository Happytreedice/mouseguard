system:
  description: "<p>Некоторые мыши оБладают неоБычаино чутким оБонянием. Про таких\
    \ гоВорят, что у них «Волчии нюх)) - это похВала, ведь Волков мыши считают самими\
    \ страшными врагами и наиБолее опасными хищниками. Эта черта крайне полезна на\
    \ охоте, но мышь с такой чертой не должна слишком входить в оБраз охотника, иначе\
    \ может одичать и деистВительно стать похожей на волка.</p>\n\n<h3>Уровни черты</h3>\n\
    <ul>\n  <li><b>Уровень 1:</b> +1D к подходящей проверке один раз за игровую сессию.</li>\n\
    \  <li><b>Уровень 2:</b> +1D к подходящей проверке два раза за игровую сессию.</li>\n\
    \  <li><b>Уровень 3:</b> +1s (успех) к результату подходящей успешной проверки\
    \ неограниченное число раз за сессию.</li>\n</ul>\n<h3>Использование черты во\
    \ вред (проверки против себя)</h3>\n<p>Вы можете сыграть черту во вред себе, чтобы\
    \ заработать проверочные баллы для Хода игроков:</p>\n<ul>\n  <li><b>-1D к своей\
    \ проверке</b> — приносит 1 проверочный балл (даже при успехе).</li>\n  <li><b>Сделать\
    \ проверку встречной со Сл 2</b> — приносит 2 проверочных балла (при ничьей или\
    \ провале).</li>\n</ul>"
