  description: |-
    <p>Полная противоположность «топографического кретина». Путешественник всегда знает, куда он идёт и где находится. У него постоянная тяга к путешествиям, из-за которой он чувствует себя неуютно, когда долго находится на одном месте, особенно в мышиных поселениях или крупных городах.</p>
    <p><strong>Когда черта помогает (примеры):</strong></p>
    <ul>
    <li>Ориентироваться, знать, куда идёшь и где находишься, прокладывать путь (например, «Следопыт», «Картограф»)</li>
    </ul>
    <p><em>Книга правил, глава «Черты», с. 296.</em></p>
  levels:
    level1: <p>Применение подходящей черты 1 уровня даёт бонус +1К при проверке. Перед броском кубиков опишите, как именно черта влияет на действия вашего персонажа и помогает ему в данный момент. Если никто не возражает против такого использования черты, добавьте себе бонусный кубик и совершите бросок для проверки способности или навыка. Каждую черту 1 уровня можно использовать только один раз за игровую сессию. Для повторного применения использованной черты перезарядите её за 2 проверочных балла или дождитесь следующей игровой сессии. (стр. 286)</p>
    level2: <p>Черту 2 уровня можно применять дважды за игровую сессию в двух разных проверках. Каждый раз такая черта будет давать бонус +1К к броску. Перед броском кубиков опишите, как именно черта влияет на действия вашего персонажа и помогает ему в данный момент. Если никто не возражает против такого использования черты, добавьте себе бонусный кубик и совершите бросок для проверки способности или навыка своего персонажа. Каждую черту 2 уровня можно использовать дважды за игровую сессию. Для повторного применения дважды использованной черты 2 уровня перезарядите её за 4 проверочных балла или дождитесь следующей игровой сессии. (стр. 286)</p>
    level3: |-
      <p>Черта 3 уровня даёт бонус +1у при проверках неограниченное количество раз. Это значит, что в подходящих ситуациях с помощью такой черты можно сколько угодно раз разрешить ничью в свою пользу или добавлять себе успехи после каждой пройденной проверки во время конфликта. (стр. 287)</p>
      <p>В главе «Вербовка»: «Черта 3 уровня даёт игроку бонус +1у к результату успешной проверки неограниченное количество раз за сессию при условии, что черта подходит». (стр. 319)</p>
  against: |-
    <p><strong>Когда черта мешает (примеры):</strong></p>
    <ul>
    <li>Неуютно долго оставаться на одном месте, особенно в поселениях и крупных городах</li>
    </ul>
    <p><strong>Как использовать черту против себя.</strong> Черты персонажа можно использовать против него самого и помогать с помощью них противнику. Чтобы мешать своему персонажу при помощи его же черты, используйте те же правила, что и для помощи. Опишите действия своего персонажа и укажите, как его черта мешает ему эти действия совершать. Если все согласны, что черта использована уместно, выберите и примените к своему персонажу один из негативных эффектов. Разрешается использовать только одну черту своего персонажа один раз за проверку, чтобы мешать ему. Во время одной проверки можно одновременно и мешать, и помогать персонажу при помощи разных черт. Нельзя использовать черты своего персонажа, чтобы мешать ему, когда вы проводите встречную проверку против персонажа, управляемого другим игроком (не ведущим). (стр. 287)</p>
    <p><strong>Негативные эффекты черт (во время одной проверки можно использовать только один; опишите его до броска):</strong></p>
    <ul>
    <li>Затруднить действия (1 проверочный балл): штраф −1К к текущему броску и 1 проверочный балл в награду.</li>
    <li>Оказаться в невыгодной ситуации (2 проверочных балла): противник получит бонус +2К к текущему броску, а вы — 2 проверочных балла в награду. Только при встречной проверке.</li>
    <li>Разрешить ничью в пользу противника (2 проверочных балла): если случится ничья, будет считаться, что ваш противник прошёл проверку, а вы нет. Только при встречной проверке. Можно использовать черту таким образом, только если вы ещё не пробовали разрешить ничью при помощи дополнительной проверки или баллов судьбы. Если победитель должен был получить и применить степень успеха, противник считается победившим со степенью успеха, равной 1. (стр. 288–289)</li>
    </ul>
    <p>Мешать персонажу при помощи его же черт и получать за это проверочные баллы во время Хода игроков запрещено. (стр. 78)</p>
  origin: 'Врождённая: список «С какими чертами родился ваш персонаж?» — для любого персонажа (стр. 318); от родителей: список «Какую черту персонаж унаследовал от родителей?» — только для «лапы помощи» (стр. 319); жизнь в пути: список уроков службы «Жизнь в пути» — только для лидера патруля или капитана Стражи (стр. 319); также может быть получена в Зимнюю сессию (стр. 174–176).'
