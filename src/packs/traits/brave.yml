name: Храбрый
type: trait
img: icons/svg/item-bag.svg
system:
  description: |
    <p>Такие мыши никогда не колеблются, ступая навстречу неизвестному. Они увлечены разными историями о далёких местах и опасных приключениях. Храбрец не потерпит, если кто-то назовёт его трусом — это самый лёгкий способ вывести его из себя.</p>
    <p><strong>Эффекты уровней:</strong></p>
    <ul>
      <li><strong>Уровень 1:</strong> Даёт бонус +1К при подходящей проверке один раз за игровую сессию.</li>
      <li><strong>Уровень 2:</strong> Можно применять дважды за игровую сессию в двух разных проверках, получая бонус +1К к каждому броску.</li>
      <li><strong>Уровень 3:</strong> Даёт бонус +1У (гарантированный успех) неограниченное количество раз за сессию. Также позволяет разрешать ничью в свою пользу.</li>
    </ul>
    <p><strong>Использование во вред себе:</strong></p>
    <p>Игрок объясняет, как черта «Храбрый» мешает ему (бездумный риск, поспешные действия, острая реакция на обвинения в трусости).</p>
    <ul>
      <li><strong>Затруднить действие:</strong> штраф -1К к текущей проверке (награда: 1 проверочный балл).</li>
      <li><strong>Оказаться в невыгодной ситуации:</strong> противник получает +2К при встречной проверке (награда: 2 проверочных балла).</li>
      <li><strong>Ничья:</strong> разрешить ничью в пользу противника при встречной проверке.</li>
    </ul>
  level: 1
  usedfor: 0
  usedagainst: 0
details:
  черта: Храбрый (Brave)
  описание: >-
    Такие мыши никогда не колеблются, ступая навстречу неизвестному. Они
    увлечены разными историями о далёких местах и опасных приключениях.
    Храбрец не потерпит, если кто-то назовёт его трусом — это самый лёгкий способ
    вывести его из себя.
  эффекты_уровней:
    уровень_1: >-
      Даёт бонус +1К (один дополнительный кубик) при подходящей проверке один раз
      за игровую сессию.
    уровень_2: >-
      Можно применять дважды за игровую сессию в двух разных проверках, получая
      бонус +1К к каждому броску.
    уровень_3: >-
      Даёт бонус +1У (один гарантированный успех к результату успешной проверки)
      неограниченное количество раз за сессию. Также позволяет
      разрешать ничью в свою пользу.
  использование_во_вред_себе:
    описание_механики: >-
      Игрок описывает действия персонажа и объясняет, как черта «Храбрый»
      мешает ему (например, мышь бездумно рискует, совершает поспешные действия
      или остро реагирует на обвинения в трусости).
    варианты_негативных_эффектов:
      - "Затруднить действие: получить штраф -1К к текущей проверке (награда: 1 проверочный балл)."
      - "Оказаться в невыгодной ситуации: дать противнику бонус +2К при встречной проверке (награда: 2 проверочных балла)."
      - "Разрешить ничью в пользу противника при встречной проверке."
    награда: >-
      За использование черты во вред себе игрок зарабатывает проверочные баллы,
      которые затем расходуются во время Хода игроков на дополнительные проверки,
      быстрое восстановление, временную прокачку или перезарядку черт.
