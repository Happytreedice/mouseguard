    \n<h3>Уровни черты</h3>\n<ul>\n  <li><b>Уровень 1:</b> +1D к подходящей проверке\
    \ один раз за игровую сессию.</li>\n  <li><b>Уровень 2:</b> +1D к подходящей проверке\
    \ два раза за игровую сессию.</li>\n  <li><b>Уровень 3:</b> +1s (успех) к результату\
    \ подходящей успешной проверки неограниченное число раз за сессию.</li>\n</ul>\n\
    <h3>Использование черты во вред (проверки против себя)</h3>\n<p>Вы можете сыграть\
    \ черту во вред себе, чтобы заработать проверочные баллы для Хода игроков:</p>\n\
    <ul>\n  <li><b>-1D к своей проверке</b> — приносит 1 проверочный балл (даже при\
