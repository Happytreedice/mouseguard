  description: "<p>Те, кто выросли или жиВут в ЛокхэиВене, имеют осоБую сВязь с Мышинои\
    \ Стражей. Таким мышам изВестно устроистВо Стражи, нужды стражей и тяготы их служБы.\
    \ Стражи уВажают и ценят тех, кто жиВёт с ними под одной крышей. Такие мыши воВлечены\
    \ в экономические и социальные отношения внутри Стражи, поэтому страЧерть1 жи\
    \ доВеряют им больше, чем другим мышам. Но стоит только один раз предать это доВерие,\
